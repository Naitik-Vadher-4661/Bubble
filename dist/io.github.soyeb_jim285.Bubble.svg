<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background / Bubble Gradients -->
    <radialGradient id="bubbleGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#89dceb" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#74c7ec" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#89b4fa" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#b4befe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0.15"/>
    </radialGradient>

    <linearGradient id="bubbleRim" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#89dceb" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#89b4fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="bubbleBackdrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <!-- Folder Gradients -->
    <linearGradient id="folderBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>

    <linearGradient id="folderFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c7ec" stop-opacity="0.92"/>
      <stop offset="40%" stop-color="#89b4fa" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#b4befe" stop-opacity="0.82"/>
    </linearGradient>

    <linearGradient id="frontHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0dc"/>
      <stop offset="100%" stop-color="#cdd6f4"/>
    </linearGradient>

    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows / Glows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#09090f" flood-opacity="0.6"/>
    </filter>

    <filter id="folderShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#11111b" flood-opacity="0.5"/>
    </filter>

    <filter id="bubbleShine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#74c7ec" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="256" cy="256" r="236" fill="url(#bubbleGlow)" opacity="0.45" filter="url(#bubbleShine)"/>

  <!-- Base App Tile (Soft Squircle / Circular Bubble Base) -->
  <rect x="28" y="28" width="456" height="456" rx="136" ry="136" fill="url(#bubbleBackdrop)" filter="url(#softShadow)"/>
  <rect x="28" y="28" width="456" height="456" rx="136" ry="136" fill="none" stroke="url(#bubbleRim)" stroke-width="2.5" opacity="0.6"/>

  <!-- Glowing Bubble Sphere Interior -->
  <circle cx="256" cy="256" r="200" fill="url(#bubbleGlow)" opacity="0.25"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#bubbleRim)" stroke-width="2" opacity="0.4"/>

  <!-- Top Specular Reflection of Outer Bubble -->
  <path d="M 120 70 C 180 46, 332 46, 392 70 C 352 94, 160 94, 120 70 Z" fill="url(#specularGlint)" opacity="0.5"/>

  <!-- Floating Micro-bubbles (Bubble motif) -->
  <circle cx="112" cy="150" r="16" fill="url(#bubbleGlow)" opacity="0.6"/>
  <circle cx="112" cy="150" r="16" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="108" cy="144" rx="4" ry="2" fill="#ffffff" opacity="0.8"/>

  <circle cx="400" cy="170" r="22" fill="url(#bubbleGlow)" opacity="0.5"/>
  <circle cx="400" cy="170" r="22" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="395" cy="163" rx="6" ry="3" fill="#ffffff" opacity="0.75"/>

  <circle cx="396" cy="358" r="14" fill="url(#bubbleGlow)" opacity="0.55"/>
  <circle cx="396" cy="358" r="14" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>

  <!-- Back Folder Body with Tab -->
  <g filter="url(#folderShadow)">
    <!-- Back Tab -->
    <path d="M 104 186 C 104 172, 114 162, 128 162 L 204 162 C 218 162, 226 170, 234 180 L 250 200 L 384 200 C 398 200, 408 210, 408 224 L 408 340 C 408 354, 398 364, 384 364 L 128 364 C 114 364, 104 354, 104 340 Z" fill="url(#folderBack)"/>
    <path d="M 104 186 C 104 172, 114 162, 128 162 L 204 162 C 218 162, 226 170, 234 180 L 250 200 L 384 200 C 398 200, 408 210, 408 224 L 408 340 C 408 354, 398 364, 384 364 L 128 364 C 114 364, 104 354, 104 340 Z" fill="none" stroke="#585b70" stroke-width="2"/>
  </g>

  <!-- Document 1 (Back Document) -->
  <g opacity="0.8">
    <rect x="156" y="184" width="180" height="130" rx="10" ry="10" fill="#a6adc8" opacity="0.4"/>
    <rect x="156" y="184" width="180" height="130" rx="10" ry="10" fill="none" stroke="#cdd6f4" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Document 2 (Main Document Inside Folder) -->
  <g filter="url(#folderShadow)">
    <!-- Main Sheet -->
    <path d="M 174 168 L 290 168 L 336 214 L 336 304 C 336 312, 330 318, 322 318 L 174 318 C 166 318, 160 312, 160 304 L 160 182 C 160 174, 166 168, 174 168 Z" fill="url(#docGrad)"/>
    <!-- Folded Corner -->
    <path d="M 290 168 L 290 208 C 290 214, 296 214, 302 214 L 336 214 Z" fill="#9399b2"/>
    <!-- Content Lines -->
    <rect x="184" y="210" width="80" height="7" rx="3.5" fill="#45475a" opacity="0.6"/>
    <rect x="184" y="228" width="128" height="6" rx="3" fill="#6c7086" opacity="0.5"/>
    <rect x="184" y="244" width="108" height="6" rx="3" fill="#6c7086" opacity="0.5"/>
    <rect x="184" y="260" width="120" height="6" rx="3" fill="#6c7086" opacity="0.5"/>
    <rect x="184" y="276" width="70" height="6" rx="3" fill="#89b4fa" opacity="0.7"/>
  </g>

  <!-- Front Folder Flap (Glassmorphic / Translucent with Vibrant Blue Gradient) -->
  <g filter="url(#softShadow)">
    <path d="M 94 246 C 94 232, 106 222, 120 222 L 392 222 C 406 222, 418 232, 418 246 L 418 362 C 418 376, 406 386, 392 386 L 120 386 C 106 386, 94 376, 94 362 Z" fill="url(#folderFront)"/>
    <!-- Top Edge Highlight for Frosted Glass Effect -->
    <path d="M 94 246 C 94 232, 106 222, 120 222 L 392 222 C 406 222, 418 232, 418 246 L 418 254 L 94 254 Z" fill="url(#frontHighlight)"/>
    <!-- Outline -->
    <path d="M 94 246 C 94 232, 106 222, 120 222 L 392 222 C 406 222, 418 232, 418 246 L 418 362 C 418 376, 406 386, 392 386 L 120 386 C 106 386, 94 376, 94 362 Z" fill="none" stroke="url(#bubbleRim)" stroke-width="2.5" opacity="0.9"/>
  </g>

  <!-- Modern Front Folder Symbol: Stylized Floating Orb / Mini-Folder Crest -->
  <g opacity="0.9">
    <!-- Bubble Orb on the Folder Center -->
    <circle cx="256" cy="304" r="32" fill="#181825" opacity="0.3"/>
    <circle cx="256" cy="304" r="30" fill="url(#bubbleGlow)" opacity="0.4"/>
    <circle cx="256" cy="304" r="30" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
    <ellipse cx="248" cy="292" rx="9" ry="5" fill="#ffffff" opacity="0.9"/>
    <!-- Center Wave / Fold Accent -->
    <path d="M 242 308 C 250 300, 262 300, 270 308" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Lower Glass Glint Across Folder Front -->
  <path d="M 106 370 C 180 340, 332 340, 406 370 C 370 382, 142 382, 106 370 Z" fill="#ffffff" opacity="0.18"/>
</svg>
